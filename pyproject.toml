[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tust-lerobot-workspace"
version = "0.1.0"
description = "TUST-iMaker Standardized Dual-OS LeRobot Workspace & Arm101 Studio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "websockets>=13.0,<18.0",
    "pyserial>=3.5,<4.0",
    "numpy>=2.0.0,<2.3.0",
    "pillow>=10.0.0,<14.0.0",
    "opencv-python-headless>=4.9.0,<4.14.0",
    "pyyaml>=6.0.0,<7.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "feetech-servo-sdk>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "playwright>=1.49.0",
]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "playwright>=1.49.0",
]
win = [
    "pygrabber>=0.2 ; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
