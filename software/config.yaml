# ========================================================
# SO-ARM101 具身机械臂全局系统配置文件 (config.yaml)
# 修改本文件中的参数，即可全局生效到遥操作、录制、回放及安全层
# ========================================================

# 1. 从臂 (Follower Arm / 执行臂) 硬件参数
follower:
  port: "/dev/ttyACM1"                  # 从臂串口设备号 (如插拔变动直接改这里)
  id: "zihao_follower_arm"              # 机械臂校准 ID (对应 calibration 中的文件名)
  type: "so101_follower"                # 机械臂型号
  baudrate: 1000000                     # 串口波特率 (飞特总线默认 1000000)

# 2. 主臂 (Leader Arm / 示教臂) 硬件参数
leader:
  port: "/dev/ttyACM0"                  # 主臂串口设备号
  id: "zihao_leader_arm"                # 主臂校准 ID (支持 leader_arm / zihao_leader_arm)
  type: "so_leader"                     # 主臂型号
  baudrate: 1000000                     # 串口波特率
  joint_offsets_deg:                    # 主从遥操作关节偏置校准 (度): 修正舵机机械安装角或标定零位偏差
    wrist_roll: 0.0                     # 五号舵机 (标定文件已更新，偏置归零)

# 3. 视觉与相机 (Camera) 配置
camera:
  port: "/dev/video0"                   # 相机设备路径 (或数字编号如 2)
  width: 640                            # 图像宽度 (像素)
  height: 480                           # 图像高度 (像素)
  fps: 30                               # 采集帧率 (Hz)
  format: "MJPG"                        # 视频流编码格式 (MJPG / YUYV)

# 4. 安全防护与姿态 (Safety & Rest Pose)
safety:
  rest_pose_file: "rest_pose.json"      # 退出/复位时的安全蜷缩姿态文件 (相对于 software 根目录)
  home_pose_file: "upright_pose.json"   # 中位姿态文件 (相对于 software 根目录)
  auto_rest_on_exit: true               # 程序退出 (Ctrl+C) 时是否强制执行平滑回蜷缩位
  rest_duration_s: 2.0                  # 回蜷缩位的平滑插值耗时(秒)，数值越大动作越柔和
  max_speed_deg_per_s: 180.0            # 单关节最大运行速度限幅 (度/秒)，防止甩臂
  max_step_deg: 15.0                    # 相邻帧之间允许的最大跳变角度 (度)

# 5. 示教采集、录制与回放 (Record & Replay & Teleop)
operation:
  fps: 30                               # 控制循环与数据录制频率 (Hz，相机硬件支持 30fps)
  dataset_repo_id: "local/so101_demo"   # 默认录制与回放的数据集名称/路径
  display: true                         # 是否开启实时可视化显示
  display_mode: "rerun"                 # 可视化引擎 (rerun / opencv)
  default_replay_episode: 0             # 默认回放的 episode 编号

